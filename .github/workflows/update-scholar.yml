name: Update Google Scholar Data

on:
  schedule:
    - cron: "0 0 * * 0"   # Every Sunday at 00:00 UTC
  workflow_dispatch:      # Allows manual one-click run in GitHub Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scholarly

      - name: Fetch Google Scholar data
        run: python scripts/update_scholar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git diff --staged --quiet || (git commit -m "chore: update Google Scholar metrics & publications" && git push)
