name: Update Google Scholar Metrics

on:
  schedule:
    - cron: "0 0 * * 0"   # Runs automatically every Sunday at 00:00 UTC
  workflow_dispatch:      # Lets you run it manually anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch Google Scholar metrics
        run: python scripts/update_scholar.py

      - name: Commit and push updated metrics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/scholar.json
          git diff --staged --quiet || (git commit -m "chore: update Google Scholar metrics" && git push)
